name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e '.[dev]'

      - name: Test
        run: pytest -v

      - name: Smoke test (CLI)
        env:
          CLIPMIND_DB_PATH: ${{ runner.temp }}/ci.db
        run: |
          python -m clipmind demo
          python -m clipmind status
          python -m clipmind search "github"
