[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipmind"
version = "0.1.0"
description = "Your clipboard, with a brain. Local-first clipboard history with semantic search and smart content extraction."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ClipMind contributors" }]
keywords = [
    "clipboard",
    "clipboard-manager",
    "semantic-search",
    "ai",
    "productivity",
    "local-first",
    "privacy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]
dependencies = [
    "pyperclip>=1.8",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "keyboard>=0.13.5",
    "numpy>=1.22",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.3"]
api = ["httpx>=0.25"]
dev = ["pytest>=7.0", "httpx>=0.25"]

[project.scripts]
clipmind = "clipmind.cli:main"

[project.urls]
Homepage = "https://github.com/clipmind/clipmind"
Issues = "https://github.com/clipmind/clipmind/issues"

[tool.setuptools.packages.find]
include = ["clipmind*"]

[tool.setuptools.package-data]
clipmind = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
